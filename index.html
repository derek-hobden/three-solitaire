<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Solitaire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="hud">
      <div class="brand">
        <h1>Solitaire</h1>
        <p>Klondike · Three.js</p>
      </div>
      <div class="stats">
        <div><span>Moves</span><strong id="moves">0</strong></div>
        <div><span>Score</span><strong id="score">0</strong></div>
        <div><span>Time</span><strong id="time">0:00</strong></div>
      </div>
      <div class="actions">
        <button type="button" id="new-game">New<span class="wide-label"> game</span></button>
        <button type="button" id="undo">Undo</button>
        <button type="button" id="hint">Hint</button>
        <button type="button" id="auto">Auto<span class="wide-label"> finish</span></button>
        <button type="button" id="draw-mode" class="toggle">Draw 3</button>
        <button type="button" id="reset-view">Reset<span class="wide-label"> view</span></button>
      </div>
    </div>
    <p id="hint-text" hidden></p>
    <div id="win" hidden>
      <div class="win-card">
        <h2>You won</h2>
        <p id="win-stats"></p>
        <button type="button" id="play-again">Deal again</button>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
